services:
  - type: web
    name: mandate
    runtime: python
    buildCommand: |
      pip install -r backend/requirements.txt
      if [ -f frontend/package.json ]; then cd frontend && npm ci && npm run build && cd ..; fi
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_ENV
        value: sandbox
      - key: LLM_API_KEY
        sync: false
      - key: CATALOG_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: mandate-db
          property: connectionString
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: DAILY_LLM_BUDGET
        value: "5.00"

databases:
  - name: mandate-db
    plan: free
