services:
  - type: web
    name: mandate
    runtime: python
    buildCommand: |
      pip install -r backend/requirements.txt
      if [ -f frontend/package.json ]; then cd frontend && npm ci && npm run build && cd ..; fi
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_ENV
        value: sandbox
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: LLM_MODEL
        value: gemini-2.5-flash
      - key: LLM_MODEL_FAST
        value: gemini-2.5-flash
      - key: CATALOG_API_KEY
        sync: false
      - key: DAILY_LLM_BUDGET
        value: "5.00"
      - key: DATABASE_URL
        fromDatabase:
          name: mandate-db
          property: connectionString

databases:
  - name: mandate-db
    # TODO: Render's free tier database expires automatically after 30 days.
    # Choose a paid plan (e.g., starter or standard) in the Render Dashboard
    # to prevent database deletion.
    plan: free
